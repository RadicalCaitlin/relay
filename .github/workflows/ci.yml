name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Scan for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # The scan covers only this run's commits, but Git needs the history to work out which those are.
          fetch-depth: 0

      # Scans the commits this run adds: a pull request's own commits, or what a push added to main.
      # Every commit of each one is scanned, so a secret added and then removed within it is still caught.
      # -m makes Git show what a merge commit itself changed, such as a conflict resolution; without it
      # merge commits contribute nothing to the scan.
      - name: Run gitleaks on the new commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          case "$BASE" in
            # No earlier commit to compare with (a branch pushed for the first time): scan all of it.
            ""|0000000000000000000000000000000000000000) range="$HEAD" ;;
            *) range="$BASE..$HEAD" ;;
          esac
          echo "Scanning: $range"
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --log-opts="-m $range" --redact --no-banner /repo

  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Relay.slnx

      - name: Build
        run: dotnet build Relay.slnx --configuration Release --no-restore

      # The tests use fake providers, so no agent CLI or credentials are needed here.
      - name: Test
        run: dotnet test Relay.slnx --configuration Release --no-build
